[package]
name = "ruscker-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admin panel and public landing for Ruscker (Askama + HTMX + Tailwind 4)"

[dependencies]
ruscker-config = { path = "../ruscker-config" }
ruscker-core = { path = "../ruscker-core" }
ruscker-proxy = { path = "../ruscker-proxy" }
dashmap = { workspace = true }

# Web stack
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-cookies = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
lol_html = { workspace = true }

# Async
tokio = { workspace = true }

# Templating + i18n
askama = { workspace = true }
fluent-templates = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

# Embedded assets
include_dir = { workspace = true }

# Errors / logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Misc
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

# Persistence (Phase 2)
sqlx = { workspace = true }

# Image library (Phase 2)
image = { workspace = true }
infer = { workspace = true }

# Credentials store (Phase 2)
aes-gcm = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# User accounts — password hashing (argon2id)
argon2 = { workspace = true }

# Async trait for the SessionStore seam (in-memory now, Postgres in HA)
async-trait = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true }
