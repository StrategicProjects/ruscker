[workspace]
resolver = "2"
members = [
    "crates/ruscker-config",
    "crates/ruscker-core",
    "crates/ruscker-docker",
    "crates/ruscker-proxy",
    "crates/ruscker-admin",
    "crates/ruscker-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Ruscker contributors"]
repository = "https://github.com/StrategicProjects/ruscker"
description = "A lightweight Rust alternative to ShinyProxy and Shiny Server Free"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web framework (axum 0.7 is the latest compatible with Rust 1.75)
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "fs", "cors"] }
hyper = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Misc utilities
regex = "1.10"
once_cell = "1.19"
url = "2.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
ordered-float = { version = "4.0", features = ["serde"] }

# Templating (Askama for compile-time templates)
askama = "0.12"

# Database (SQLite via sqlx)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }

# Docker client
bollard = "0.15"

# Cryptography
ring = "0.17"
base64 = "0.21"

# Testing
pretty_assertions = "1.4"
insta = { version = "1.34", features = ["yaml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
