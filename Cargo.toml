[workspace]
resolver = "2"
members = [
    "crates/ruscker-config",
    "crates/ruscker-core",
    "crates/ruscker-docker",
    "crates/ruscker-proxy",
    "crates/ruscker-admin",
    "crates/ruscker-cli",
]

[workspace.package]
version = "0.1.52"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Ruscker contributors"]
repository = "https://github.com/StrategicProjects/ruscker"
description = "A lightweight Rust alternative to ShinyProxy and Shiny Server Free"

# Workspace dependencies pinned to latest stable as of repo bring-up.
# Policy: when adding or bumping a dep, ALWAYS verify the latest stable
# release on crates.io / GitHub releases — never rely on memory.
# See PLAN.md §10 (policy of latest stable).
[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1.89"

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "cors", "compression-gzip", "compression-br"] }
tower-cookies = "0.11"
hyper = "1.9"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
async-stream = "0.3.6"
lol_html = "2.9"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0.150"

# Error handling
thiserror = "2.0"
anyhow = "1.0.102"

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Misc utilities
regex = "1.12"
# once_cell removed — Rust 1.95 std::sync::LazyLock is used instead
url = "2.5.8"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "6.2"
ordered-float = { version = "5.3", features = ["serde"] }

# Templating + i18n
askama = { version = "0.16", features = ["serde_json"] }
fluent-templates = "0.14"
fluent-bundle = "0.16"
unic-langid = "0.9"
include_dir = "0.7"

# Image processing (Phase 2 image library). default-features=false so
# we avoid pulling AVIF/EXR/HDR/TIFF/...  we only need PNG/JPEG/WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
# Sniff MIME from magic bytes; client Content-Type can lie.
infer = "0.19"

# Database: SQLite is the single-node source of truth; Postgres backs
# the optional HA session store (Phase 7, `PostgresSessionStore`).
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "macros", "chrono", "uuid"] }

# Docker client. `ssh` + `ssl` enable remote daemons over `ssh://` and
# `tcp://` (mTLS) for multi-host scheduling (Phase 6); the default
# `http`+`pipe` only cover the local socket.
bollard = { version = "0.21", features = ["ssh", "ssl"] }

# Cryptography
ring = "0.17.14"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = "1.8"
hex = "0.4"
# Password hashing for admin user accounts (argon2id). `std` pulls in
# the OsRng salt generator via password-hash.
argon2 = { version = "0.5", features = ["std"] }

# Testing
pretty_assertions = "1.4"
insta = { version = "1.47", features = ["yaml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
