[package]
name = "ruscker-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ruscker command-line interface"

[[bin]]
name = "ruscker"
path = "src/main.rs"

# --- Debian/Ubuntu packaging (cargo-deb) -----------------------------
# Build with: cargo deb -p ruscker-cli
# Paths are relative to this manifest dir, hence the ../../ to reach the
# repo-root `packaging/` directory.
[package.metadata.deb]
name = "ruscker"
maintainer = "Ruscker contributors <ruscker@strategicprojects.github.io>"
copyright = "2025-2026, Ruscker contributors. Licensed under Apache-2.0."
section = "web"
priority = "optional"
# $auto pulls the binary's shared-lib deps (libc, …); ca-certificates
# for TLS when pulling private images; adduser because the postinst uses
# addgroup/adduser to create the service account (Ubuntu 24.04 minimal no
# longer ships it in the base set).
depends = "$auto, ca-certificates, adduser"
# `docker.io` is the canonical Docker engine package in Debian/Ubuntu
# main. It's a Recommends, not a Depends, because Ruscker's landing +
# admin still serve without a backend (#184). Any Docker-API-compatible
# engine works (docker-ce, podman with podman-docker, …) — operators
# who pull from a third-party APT source already know how to satisfy
# this themselves.
recommends = "docker.io"
extended-description = """\
Ruscker is a lightweight Rust alternative to ShinyProxy and Shiny Server \
Free. It hosts and load-balances containerized interactive web apps \
(R/Shiny, Streamlit, Dash, Voila) and stateless HTTP APIs behind a single \
proxy with a custom landing page and an admin panel. Ships as a single \
binary with no JVM."""
assets = [
    ["target/release/ruscker", "usr/bin/", "755"],
    ["../../packaging/debian/ruscker-enable-docker", "usr/sbin/ruscker-enable-docker", "755"],
    # The service config is ruscker.yml (#976); application.yml is no
    # longer installed — it stays as the ShinyProxy IMPORT format (and
    # an edited one from an older package is migrated by postinst).
    ["../../packaging/ruscker.yml.example", "etc/ruscker/ruscker.yml", "644"],
    # Pristine reference copy: postinst compares against it to decide
    # whether /etc/ruscker/ruscker.yml is still untouched on upgrade.
    ["../../packaging/ruscker.yml.example", "usr/share/ruscker/ruscker.yml.example", "644"],
    ["../../packaging/ruscker.env.example", "etc/ruscker/ruscker.env", "640"],
    ["../../packaging/README.Debian", "usr/share/doc/ruscker/README.Debian", "644"],
]
conf-files = ["/etc/ruscker/ruscker.yml", "/etc/ruscker/ruscker.env"]
maintainer-scripts = "../../packaging/debian/"

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging/systemd"
enable = true
start = true

[dependencies]
ruscker-config = { path = "../ruscker-config" }
ruscker-core = { path = "../ruscker-core" }
ruscker-admin = { path = "../ruscker-admin" }
ruscker-docker = { path = "../ruscker-docker" }

clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Live end-to-end test against a real container (needs Docker + network).
# Off by default; run with `cargo test -p ruscker-cli --features e2e`.
e2e = []

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
