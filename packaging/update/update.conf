# /etc/ruscker/update.conf — how this server follows new Ruscker
# releases. Read by ruscker-update (see `ruscker-update --help`).
#
# Nothing here has any effect until the timer is turned on:
#   systemctl enable --now ruscker-update.timer
# `ruscker-update --check` and `--apply` by hand work regardless.

# What the timer does when it finds a newer release:
#   check — only records it (and says so in the journal);
#   auto  — installs it, verifies the service, and goes back to the
#           previous version if the verification fails.
MODE=check

# In MODE=auto, a release that changes the database is NOT installed
# by the timer: after a migration, going back means restoring the
# database copy, so a person should decide. Such a release waits for
#   ruscker-update --apply --allow-migrations
# Set to yes to let the timer install those too.
APPLY_MIGRATIONS=no

# Automatic installs only between these hours (local time, 24 h,
# "from-to" with two different hours; may cross midnight, e.g. 22-04).
# Empty = any hour. A value that cannot be read stops the update.
WINDOW=01-05

# Never go past this version (e.g. PIN=0.3.1). Empty = follow the
# latest release.
PIN=
