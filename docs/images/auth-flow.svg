<?xml version="1.0" encoding="UTF-8"?>
<svg class="rk-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" width="720" height="510" font-family="Jost, Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Authorization-code flow with PKCE between the external system's server, the user's browser and Ruscker. 1: the user opens the system. 2: the system redirects the browser to Ruscker's authorize endpoint with a PKCE challenge. 3: the user signs in at Ruscker, which checks groups and two-step verification. 4: Ruscker redirects back with a one-use code, which the browser hands to the system. 5: the system's server posts the code, its secret and the PKCE verifier to the token endpoint. 6: Ruscker answers with an ID token signed with ES256.">
  <title>Ruscker — signing in to an external system</title>
  <style media="(prefers-color-scheme: dark)" data-rk-dark="">
    .rk-d rect[fill="#FFFFFF" i], .rk-d circle[fill="#FFFFFF" i] { fill: #132a22; }
    .rk-d rect[fill="#F4F8F7" i], .rk-d path[fill="#F4F8F7" i] { fill: #0f211b; }
    .rk-d rect[fill="#E8F3EE" i], .rk-d path[fill="#E8F3EE" i] { fill: #17352b; }
    .rk-d rect[fill="#CDECE0" i], .rk-d path[fill="#CDECE0" i] { fill: #1c4034; }
    .rk-d [fill="#1A1A1A" i] { fill: #e7f3ee; }
    .rk-d text[fill="#085041" i], .rk-d tspan[fill="#085041" i] { fill: #a8e6cf; }
    .rk-d text[fill="#0F6E56" i], .rk-d tspan[fill="#0F6E56" i] { fill: #5dcaa5; }
    .rk-d [fill="#5B6B66" i] { fill: #9bb8ac; }
    .rk-d [fill="#90A39C" i], .rk-d [fill="#B9CDC6" i] { fill: #7f9c90; }
    .rk-d [stroke="#0F6E56" i] { stroke: #2fae87; }
    .rk-d [stroke="#D7E5E0" i] { stroke: #2a4a3f; }
    .rk-d [stroke="#B9CDC6" i] { stroke: #3b5a4f; }
    .rk-d path[stroke="#FFFFFF" i][fill="#1D9E75" i] { stroke: #08130f; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="110" y1="72" x2="110" y2="456" stroke="#B9CDC6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="360" y1="72" x2="360" y2="456" stroke="#B9CDC6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="610" y1="72" x2="610" y2="456" stroke="#B9CDC6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- who -->
  <rect x="30" y="20" width="160" height="52" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="110" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">External system</text>
  <text x="110" y="60" text-anchor="middle" font-size="11" fill="#5B6B66">its server</text>

  <rect x="280" y="20" width="160" height="52" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Browser</text>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#5B6B66">the user</text>

  <rect x="530" y="20" width="160" height="52" rx="10" fill="#E8F3EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="610" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Ruscker</text>
  <text x="610" y="60" text-anchor="middle" font-size="11" fill="#5B6B66">sign-in provider</text>

  <!-- 1 -->
  <line x1="360" y1="112" x2="110" y2="112" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="104" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">1</tspan> · opens the system</text>

  <!-- 2 -->
  <line x1="110" y1="158" x2="360" y2="158" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="235" y="150" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">2</tspan> · redirect to Ruscker</text>
  <line x1="360" y1="158" x2="610" y2="158" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="150" text-anchor="middle" font-size="11.5" fill="#5B6B66">/oauth/authorize + PKCE challenge</text>

  <!-- 3 -->
  <line x1="610" y1="212" x2="360" y2="212" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="485" y="204" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">3</tspan> · sign in · groups · 2FA</text>

  <!-- 4 -->
  <line x1="610" y1="266" x2="360" y2="266" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="485" y="258" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">4</tspan> · redirect back with a one-use code</text>
  <line x1="360" y1="266" x2="110" y2="266" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="258" text-anchor="middle" font-size="11.5" fill="#5B6B66">code</text>

  <!-- 5 and 6: server to server -->
  <rect x="96" y="300" width="528" height="118" rx="12" fill="#F4F8F7" stroke="#D7E5E0" stroke-width="1"/>
  <text x="360" y="320" text-anchor="middle" font-size="11" font-style="italic" fill="#5B6B66">server to server — the browser never sees this</text>
  <line x1="110" y1="356" x2="610" y2="356" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="348" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">5</tspan> · POST /oauth/token · client secret + code + PKCE verifier</text>
  <line x1="610" y1="400" x2="110" y2="400" stroke="#0F6E56" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#5B6B66"><tspan font-weight="700" fill="#085041">6</tspan> · ID token (ES256)</text>

  <text x="30" y="486" font-size="11" font-style="italic" fill="#5B6B66">the system keeps its own session</text>
  <text x="690" y="486" text-anchor="end" font-size="11" font-style="italic" fill="#5B6B66">Ruscker authenticates; the system authorizes</text>
</svg>
