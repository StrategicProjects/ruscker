[package]
name = "ruscker-sso"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Resolver 3 picks dependency versions that still build on `rust-version`
# (several current releases already need a newer compiler).
resolver = "3"
description = "Sign people in to a Rust backend through a Ruscker portal (OpenID Connect, code flow + PKCE)"
license = "Apache-2.0"
repository = "https://github.com/StrategicProjects/ruscker"
homepage = "https://ruscker.com/client-packages.html"
readme = "README.md"
keywords = ["oidc", "openid-connect", "sso", "authentication", "axum"]
categories = ["authentication", "web-programming"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

# An empty table makes this crate its own workspace root, so it never
# joins (or disturbs) the workspace of the repository it lives in.
[workspace]

[dependencies]
# HTTP for discovery, the JWKS and the code exchange. The `rustls`
# feature uses aws-lc-rs as its crypto provider; jsonwebtoken is set to
# the same backend below, so the crate carries one crypto library.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
# ID token verification (ES256 against the JWKS). The 10.x line is the
# newest whose MSRV is 1.85; 11 and 12 need Rust 1.88.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
url = "2.5.8"
# OS random source for state, nonce and the PKCE verifier.
getrandom = "0.4.3"
# The PKCE S256 challenge.
sha2 = "0.10.9"
base64 = "0.22.1"
# Constant-time comparison of state and nonce.
subtle = "2.6.1"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
