name: docs

# Build the mdBook site — plus the R client package's reference site,
# served under /r/ — and publish it to GitHub Pages
# (https://strategicprojects.github.io/ruscker/).
#
# Requires Pages to be enabled for the repo with source = "GitHub
# Actions" (Settings → Pages → Build and deployment → Source).

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**" # chapters {{#include}} files from docs/
      - "clients/r/**" # the R package's pkgdown site lives under /r/
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Match the version built locally. 0.4.x shipped an older theme
      # whose wide-screen edge chevrons (prev/next chapter) were easy to
      # mistake for a broken sidebar toggle; 0.5.x has the clean
      # "Toggle Table of Contents" sidebar button.
      MDBOOK_VERSION: "0.5.3"
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build book

      # The R client package's reference site (pkgdown), into /r/ of the
      # same site. Built after the book, which owns the output folder.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: clients/r
          extra-packages: any::pkgdown, local::.
      - name: Build the R package site
        run: |
          Rscript -e 'pkgdown::build_site("clients/r", override = list(destination = file.path(getwd(), "book/book/r")), preview = FALSE)'
          test -f book/book/r/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

      - id: deployment
        uses: actions/deploy-pages@v5
