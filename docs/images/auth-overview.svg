<?xml version="1.0" encoding="UTF-8"?>
<svg class="rk-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Jost, Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="One account base in Ruscker: accounts, groups and two-step verification. The user signs in once. A hosted app receives identity headers on every request, added by the proxy. An external system receives an ID token over OpenID Connect, once per sign-in, and verifies it itself.">
  <title>Ruscker — one account base, two ways to use it</title>
  <style media="(prefers-color-scheme: dark)" data-rk-dark="">
    .rk-d rect[fill="#FFFFFF" i], .rk-d circle[fill="#FFFFFF" i] { fill: #132a22; }
    .rk-d rect[fill="#F4F8F7" i], .rk-d path[fill="#F4F8F7" i] { fill: #0f211b; }
    .rk-d rect[fill="#E8F3EE" i], .rk-d path[fill="#E8F3EE" i] { fill: #17352b; }
    .rk-d rect[fill="#CDECE0" i], .rk-d path[fill="#CDECE0" i] { fill: #1c4034; }
    .rk-d [fill="#1A1A1A" i] { fill: #e7f3ee; }
    .rk-d text[fill="#085041" i], .rk-d tspan[fill="#085041" i] { fill: #a8e6cf; }
    .rk-d text[fill="#0F6E56" i], .rk-d tspan[fill="#0F6E56" i] { fill: #5dcaa5; }
    .rk-d [fill="#5B6B66" i] { fill: #9bb8ac; }
    .rk-d [fill="#90A39C" i], .rk-d [fill="#B9CDC6" i] { fill: #7f9c90; }
    .rk-d [stroke="#0F6E56" i] { stroke: #2fae87; }
    .rk-d [stroke="#D7E5E0" i] { stroke: #2a4a3f; }
    .rk-d [stroke="#B9CDC6" i] { stroke: #3b5a4f; }
    .rk-d path[stroke="#FFFFFF" i][fill="#1D9E75" i] { stroke: #08130f; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/>
    </marker>
  </defs>

  <!-- the user -->
  <rect x="20" y="95" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="90" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">User</text>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#5B6B66">browser</text>

  <line x1="160" y1="125" x2="250" y2="125" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="203" y="116" text-anchor="middle" font-size="11" fill="#5B6B66">signs in once</text>

  <!-- Ruscker -->
  <rect x="250" y="80" width="190" height="90" rx="12" fill="#E8F3EE" stroke="#0F6E56" stroke-width="2"/>
  <g transform="translate(262,86) scale(0.3)">
    <polygon points="14,52 40,40 66,52 40,64" fill="#1D9E75" opacity="0.45"/>
    <polygon points="14,40 40,28 66,40 40,52" fill="#1D9E75" opacity="0.72"/>
    <polygon points="14,28 40,16 66,28 40,40" fill="#1D9E75"/>
  </g>
  <text x="345" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#085041">Ruscker</text>
  <text x="345" y="143" text-anchor="middle" font-size="11" fill="#5B6B66">accounts · groups · 2FA</text>

  <!-- to a hosted app -->
  <path d="M440,110 H465 V60 H560" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="51" text-anchor="middle" font-size="11" fill="#5B6B66">identity headers</text>
  <rect x="560" y="30" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="630" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Hosted app</text>
  <text x="630" y="75" text-anchor="middle" font-size="11" fill="#5B6B66">behind /app/{id}</text>
  <text x="700" y="108" text-anchor="end" font-size="11" font-style="italic" fill="#5B6B66">per request, added by the proxy</text>

  <!-- to an external system -->
  <path d="M440,140 H465 V190 H560" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="512" y="181" text-anchor="middle" font-size="11" fill="#5B6B66">ID token · OIDC</text>
  <rect x="560" y="160" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2"/>
  <text x="630" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">External system</text>
  <text x="630" y="205" text-anchor="middle" font-size="11" fill="#5B6B66">another host or domain</text>
  <text x="700" y="238" text-anchor="end" font-size="11" font-style="italic" fill="#5B6B66">once per sign-in, verified by the system</text>
</svg>
