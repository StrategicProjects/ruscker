[package]
name = "ruscker-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Admin panel and public landing for Ruscker (Askama + HTMX + Tailwind 4)"

[features]
# End-to-end test of PostgresSessionStore against a real Postgres.
# Enable with `cargo test -p ruscker-admin --features postgres-it` and
# set RUSCKER_TEST_PG_URL to a reachable `postgres://` DSN. See
# crates/ruscker-admin/src/sessions_pg.rs for a throwaway-daemon recipe.
postgres-it = []

[dependencies]
ruscker-config = { path = "../ruscker-config" }
ruscker-core = { path = "../ruscker-core" }
ruscker-proxy = { path = "../ruscker-proxy" }
dashmap = { workspace = true }

# Web stack
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-cookies = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
# Outbound HTTPS for alert webhooks (#930). Both already compiled
# transitively via bollard — no new tree weight. The explicit `rustls`
# dep exists only to name a CryptoProvider: the tree carries BOTH
# ring and aws-lc-rs, so rustls refuses to pick a process default and
# the connector must be built with one explicitly.
hyper-rustls = "0.27"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { workspace = true }
async-stream = { workspace = true }
lol_html = { workspace = true }

# Async
tokio = { workspace = true }

# Templating + i18n
askama = { workspace = true }
fluent-templates = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

# Embedded assets
include_dir = { workspace = true }

# Host disk usage for the admin disk panel (statvfs) — already compiled
# transitively, no new build cost (#623).
libc = "0.2"

# Precompress the bundled CSS/JS once at startup (#593) instead of letting
# the CompressionLayer re-encode these immutable bytes on every request.
# Both already compile transitively (tower-http → async-compression).
flate2 = "1.1"
brotli = "8.0"

# Errors / logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Misc
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Persistence (Phase 2)
sqlx = { workspace = true }

# Image library (Phase 2)
image = { workspace = true }
infer = { workspace = true }

# Credentials store (Phase 2)
aes-gcm = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# User accounts — password hashing (argon2id)
argon2 = { workspace = true }

# Async trait for the SessionStore seam (in-memory now, Postgres in HA)
async-trait = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true }
# WS client + mock upstream for the proxy upgrade tests (#730)
tokio-tungstenite = { workspace = true }
