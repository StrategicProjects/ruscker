[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ruscker-sso"
version = "0.1.0"
description = "Sign people in to a backend through a Ruscker portal (OpenID Connect, authorization code + PKCE)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # ES256 signature checks and JWKS parsing. The [crypto] extra pulls in
    # `cryptography`, which does the actual elliptic-curve maths.
    "PyJWT[crypto]>=2.10.1,<3",
    # Discovery, JWKS and token requests.
    "httpx>=0.27,<1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ruscker_sso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
