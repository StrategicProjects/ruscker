[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ruscker-sso"
version = "0.1.0"
description = "Sign people in to a backend through a Ruscker portal (OpenID Connect, authorization code + PKCE)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "André Leite", email = "leite@castlab.org" },
    { name = "Marcos Wasiliew", email = "marcos.wasiliew@gmail.com" },
    { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
    { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
    { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
    { name = "Júlia Nascimento Barreto", email = "juliabarreto@gd.seplag.pe.gov.br" },
]
keywords = ["oidc", "openid-connect", "sso", "authentication", "pkce"]
dependencies = [
    # ES256 signature checks and JWKS parsing. The [crypto] extra pulls in
    # `cryptography`, which does the actual elliptic-curve maths.
    "PyJWT[crypto]>=2.10.1,<3",
    # Discovery, JWKS and token requests.
    "httpx>=0.27,<1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://ruscker.com/client-packages.html"
Documentation = "https://ruscker.com/authentication.html"
Repository = "https://github.com/StrategicProjects/ruscker"
Issues = "https://github.com/StrategicProjects/ruscker/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ruscker_sso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
