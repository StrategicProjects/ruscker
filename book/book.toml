[book]
title = "Ruscker"
description = "A lightweight Rust alternative to ShinyProxy and Shiny Server Free — host and load-balance containerized apps behind one proxy with a real admin panel."
authors = ["Ruscker contributors"]
language = "en"
src = "src"

[output.html]
# The site follows the system: light, or dark in mdBook's "navy" slot.
# Both palettes are redefined in theme/ruscker.css to match the landing
# page (book/landing/), which the docs workflow puts at the site's root.
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/ruscker.css"]
additional-js = ["theme/ruscker.js"]
git-repository-url = "https://github.com/StrategicProjects/ruscker"
edit-url-template = "https://github.com/StrategicProjects/ruscker/edit/main/book/{path}"
# Project Pages live under /ruscker/ — set so links/assets resolve there.
site-url = "/ruscker/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
